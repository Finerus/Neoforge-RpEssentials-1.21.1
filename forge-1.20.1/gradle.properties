# Gradle settings (memory...) are in the gradle.properties of the root folder.

#read more on this at https://github.com/neoforged/NeoGradle/blob/NG_7.0/README.md#apply-parchment-mappings
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.20.1]
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.4.28
# Versions accepted by the mod (the jar is built with forge_version above).
# 47.1.0: oldest version the mod compiles and runs with. NeoForge for Minecraft 1.20.1 is numbered 47.1.x too.
forge_version_range=[47.1,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[47,)
curios_version=5.14.1+1.20.1

