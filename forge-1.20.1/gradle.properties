mod_description=A professional utility suite designed for immersive Roleplay servers.\n\n\
\u27A4 KEY FEATURES:\n\n\
\u2022 Identity Obfuscation: proximity-based name hiding, sneak stealth, tab list blur, nametag blur & skin concealment\n\n\
\u2022 Nicknames & Character Sheets: persistent RP names (colors, hex & gradients) everywhere, and staff-only character sheets (age, race, languages, appearance, lore, custom fields) that can be prepared before the player joins\n\n\
\u2022 Professions & Licenses: craft, use, equip, mining and container restrictions per job, temporary licenses and physical license items\n\n\
\u2022 Roles & Permissions: role-based staff and bypass permissions, with optional two-way LuckPerms sync\n\n\
\u2022 Advanced Chat: Markdown, proximity chat, private messages, RP commands, dice, announcements, custom join/leave messages\n\n\
\u2022 Server Schedule: per-day opening hours, auto-kick, warnings, Death Hours & HRP Hours\n\n\
\u2022 Death RP: permanent death system with global/per-player toggle and whitelist removal\n\n\
\u2022 Moderation: warns, mutes, temp bans, player reports, staff notes, full player history, vanish, auto-unwhitelist and an optional Discord webhook\n\n\
\u2022 Staff GUIs: Player Profile, Profession & Role editor and an in-game Config Manager with search, value checks and unsaved-changes guards\n\n\
\u2022 World Border & Named Zones: square or circle limit, distance warnings and entry/exit zone messages\n\n\
\u2022 Fully configurable and translatable (English & French included)

