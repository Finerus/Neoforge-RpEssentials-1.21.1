plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${mod_version}+forge-${minecraft_version}"
group = mod_group_id

repositories {
    mavenCentral()
    maven { url "https://api.modrinth.com/maven" }
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
}

base {
    archivesName = mod_id
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = mod_group_id
            artifactId = mod_id
            version = project.version
            artifact jar
        }
    }
}

// Minecraft 1.20.1 runs on Java 17: the mod must be compiled for Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// ModDevGradle (legacy Forge flavour): sets up Minecraft + Forge 1.20.1, the run configurations and IntelliJ.
legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        // Own folders: the worlds of the NeoForge 1.21.1 branch (runs/client, runs/server) must never be opened
        // by Minecraft 1.20.1 (a newer world cannot be loaded by an older game).
        client {
            client()
            gameDirectory = project.file('runs/forge-1.20.1/client')
        }
        // Second player for tests (two clients at once): own folder (options, logs) and own name.
        // Same name as the first client ("Dev") = same UUID = one kicks the other.
        client2 {
            client()
            gameDirectory = project.file('runs/forge-1.20.1/client2')
            programArguments.addAll('--username', 'Dev2')
        }
        server {
            server()
            gameDirectory = project.file('runs/forge-1.20.1/server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('runs/forge-1.20.1/gameTestServer')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Mixins: Forge 1.20.1 needs a refmap (names are obfuscated in production).
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixin.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // MixinExtras (@WrapOperation, @Local): bundled in NeoForge, but not in Forge 1.20.1 -> shipped inside our jar.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1"))

    compileOnly 'net.luckperms:api:5.4'

    // Immersive Messages (and its library TxniLib): optional, only used for the IMMERSIVE display mode.
    modCompileOnly "maven.modrinth:immersive-messages-api:forge-1.20.1-1.0.18"
    modCompileOnly "maven.modrinth:txnilib:forge-1.20.1-1.0.24"

    modCompileOnly "top.theillusivec4.curios:curios-forge:${curios_version}:api"
    modRuntimeOnly "top.theillusivec4.curios:curios-forge:${curios_version}"
}

jar {
    manifest {
        attributes(['MixinConfigs': "${mod_id}.mixin.json"])
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_logo_file          : mod_logo_file
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [file: [jarVersion: mod_version]]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '5000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
